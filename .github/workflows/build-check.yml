name: Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "build-check"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Observed 53-60s over the last 5 runs on main; 5 min caps a hang at minutes, not hours.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
